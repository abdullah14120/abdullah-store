/*
 * Developed & Refined by: Abdullah Al-Tamimi
 * Component: App Level Build Configuration
 */

apply plugin: 'com.android.application'
apply plugin: "androidx.navigation.safeargs"

android {
    compileSdkVersion 30 // رفعته قليلاً لضمان التوافق

    defaultConfig {
        multiDexEnabled true

        // المعرف الفريد الخاص بمتجرك
        applicationId "com.fix.engine.abdullah"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 1
        versionName "1.0.0-FIX"

        // لغات العرض الأساسية
        resConfigs "ar", "en"

        vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                includeCompileClasspath false
            }
        }
    }

    compileOptions {
        targetCompatibility 1.8
        sourceCompatibility 1.8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    signingConfigs {
        release
    }

    buildTypes {
        release {
            minifyEnabled true
            zipAlignEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            
            // تغيير اسم التطبيق رسمياً
            resValue "string", "app_name", "FIX ENGINE"
        }
        beta {
            initWith release
            applicationIdSuffix = ".beta"
            resValue "string", "app_name", "FIX ENGINE - Beta"
        }
        debug {
            resValue "string", "app_name", "FIX ENGINE - Debug"
        }
    }
}

// تعريف النسخ للمكتبات الخارجية
buildscript {
    ext {
        versions = [
                fastAdapter: "5.0.0",
                okhttp3    : "4.9.1", // تحديث okhttp للتوافق
                glide      : "4.12.0",
                room       : "2.3.0",
                butterknife: "10.2.3",
                libsu      : "3.0.2",
                fetch2     : "3.1.5"
        ]
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'commons-io:commons-io:2.8.0'
    implementation 'org.apache.maven:maven-artifact:3.6.3'

    // Jetpack & AndroidX
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.3.1'
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.preference:preference:1.1.1'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // Material Design & JSON
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'com.google.code.gson:gson:2.8.6'

    // FastAdapter (لإدارة القوائم في متجرك)
    implementation "com.mikepenz:fastadapter:${versions.fastAdapter}"
    implementation "com.mikepenz:fastadapter-extensions-diff:${versions.fastAdapter}"
    implementation "com.mikepenz:fastadapter-extensions-ui:${versions.fastAdapter}"

    implementation 'me.zhanghai.android.fastscroll:library:1.1.5'
    implementation 'io.github.luizgrp.sectionedrecyclerviewadapter:sectionedrecyclerviewadapter:3.2.0'

    // Utils
    implementation 'org.apache.commons:commons-text:1.9'
    implementation 'commons-validator:commons-validator:1.7'

    // Lombok (للمبرمجين)
    compileOnly "org.projectlombok:lombok:1.18.20"
    annotationProcessor "org.projectlombok:lombok:1.18.20"

    // Database Room
    implementation "androidx.room:room-runtime:${versions.room}"
    annotationProcessor "androidx.room:room-compiler:${versions.room}"

    // Networking OkHTTP
    implementation "com.squareup.okhttp3:okhttp:${versions.okhttp3}"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:${versions.okhttp3}"

    // RX-Java
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'com.jakewharton.rxrelay2:rxrelay:2.1.1'

    // ButterKnife (للواجهات)
    implementation "com.jakewharton:butterknife:${versions.butterknife}"
    annotationProcessor "com.jakewharton:butterknife-compiler:${versions.butterknife}"

    // Glide (للصور)
    implementation "com.github.bumptech.glide:glide:${versions.glide}"
    annotationProcessor "com.github.bumptech.glide:compiler:${versions.glide}"

    // Downloader
    implementation "androidx.tonyodev.fetch2:xfetch2:${versions.fetch2}"

    // SuperUser (Lib-SU) - لدعم الروت
    implementation "com.github.topjohnwu.libsu:core:${versions.libsu}"

    debugImplementation 'com.amitshekhar.android:debug-db:1.0.6'
}

// منطق التوقيع (Signing)
def propFile = new File('signing.properties')
if (propFile.canRead()) {
    def props = new Properties()
    props.load(new FileInputStream(propFile))
    if (props.containsKey('STORE_FILE')) {
        android.signingConfigs.release.storeFile = file(props['STORE_FILE'])
        android.signingConfigs.release.storePassword = props['STORE_PASSWORD']
        android.signingConfigs.release.keyAlias = props['KEY_ALIAS']
        android.signingConfigs.release.keyPassword = props['KEY_PASSWORD']
    }
}
