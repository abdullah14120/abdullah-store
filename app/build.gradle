plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
}

android {
    // تم استخدام namespace بدلاً من الاعتماد على Manifest فقط (متطلب لـ Gradle الحديث)
    namespace "com.fix.engine.abdullah"
    compileSdkVersion 30

    defaultConfig {
        applicationId "com.fix.engine.abdullah"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 1
        versionName "1.0.0-FIX"

        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "FIX ENGINE"
        }
        debug {
            resValue "string", "app_name", "FIX ENGINE Debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // تم تحديث الطريقة لتجنب خطأ dsl.DependencyHandler.module
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    
    // استخدام الصيغة الحديثة للمكتبات
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    
    // باقي المكتبات بنفس الطريقة (implementation بدلاً من compile)
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'
    
    // مكتبة ButterKnife (تأكد من تحديثها لتعمل مع Gradle 8+)
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    
    // مكتبات المحرك الأساسية
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
}
